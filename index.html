:root {
  color-scheme: dark;
  --ground: #09090B;
  --text: #FAFAFA;
  --wall: #71717A;
  --thread: #34D399;
  --font-display: 'Sora', 'Avenir Next', 'Segoe UI', sans-serif;
  --logo-mark: 52px;
  --logo-font: 34px;
  --logo-gap: 6px;
  --logo-lift: -0.03em;
  --p: 0;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--font-display);
}

.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  height: calc(104px - 36px * var(--p));
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--ground);
  border-bottom: 1px solid rgb(39 39 42 / var(--p));
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: var(--logo-gap);
  color: var(--text);
  text-decoration: none;
  transform: scale(calc(1 - 0.16 * var(--p)));
  border-radius: 6px;
}
.logo:focus-visible {
  outline: 2px solid var(--thread);
  outline-offset: 8px;
}
.logo-mark {
  flex: none;
  width: var(--logo-mark);
  height: var(--logo-mark);
  overflow: visible;
}
.logo-wall {
  fill: none;
  stroke: var(--wall);
  stroke-width: 5;
}
.logo-clew {
  fill: var(--thread);
}
.logo-word {
  display: flex;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--logo-font);
  line-height: 1.3;
  letter-spacing: 0.01em;
  white-space: nowrap;
  margin-bottom: calc(2 * var(--logo-lift));
}
.logo-word > span {
  flex: none;
  display: block;
}
.logo-word .x {
  overflow: hidden;
}
.logo-word .u {
  position: relative;
}
.logo-word .u .lo {
  display: block;
}
.logo-word .u .up {
  position: absolute;
  left: 0;
  top: 0;
  opacity: 0;
}

main {
  min-height: 100%;
  padding: 104px 24px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
h1 {
  margin: 0;
  font-weight: 700;
  font-size: clamp(44px, 11vw, 136px);
  line-height: 1;
  letter-spacing: -0.02em;
  text-align: center;
}
</style>
</head>

    points = [[48, 48], [23.5, 48], [23.5, 72.5], [72.5, 72.5], [72.5, 48], [hitX - HALF, 48]];
    lengths = [];
    total = 0;
    for (var i = 1; i < points.length; i++) {
      var d = Math.abs(points[i][0] - points[i - 1][0]) + Math.abs(points[i][1] - points[i - 1][1]);
      lengths.push(d);
      total += d;
    }

    var scroller = document.scrollingElement || root;
    var maxScroll = scroller.scrollHeight - window.innerHeight;
    distance = maxScroll > 0 ? Math.min(SCROLL_DISTANCE, maxScroll) : SCROLL_DISTANCE;

    logo.style.transform = '';
    update();
  }

  function pointAt(t) {
    var dist = t * total;
    for (var i = 0; i < lengths.length; i++) {
      if (dist <= lengths[i] || i === lengths.length - 1) {
        var f = lengths[i] ? clamp(dist / lengths[i]) : 1;
        return [
          points[i][0] + (points[i + 1][0] - points[i][0]) * f,
          points[i][1] + (points[i + 1][1] - points[i][1]) * f
        ];
      }
      dist -= lengths[i];
    }
    return points[points.length - 1];
  }

  function update() {
    ticking = false;
    var scrollTop = (document.scrollingElement || root).scrollTop;
    var p = clamp(scrollTop / distance);
    if (reduceMotion.matches) { p = p >= 1 ? 1 : 0; }

    var t = clamp(p / TRAVEL_END);
    var q = clamp((p - TRAVEL_END) / (COLLAPSE_END - TRAVEL_END));
    var u = smooth(clamp((p - CAPS_START) / (1 - CAPS_START)));

    root.style.setProperty('--p', p.toFixed(4));

    var pos = pointAt(t);
    clew.setAttribute('transform', 'translate(' + (pos[0] - 48).toFixed(2) + ' ' + (pos[1] - 48).toFixed(2) + ')');

    clew.style.opacity = (1 - clamp((p - FADE_START) / 0.06)).toFixed(3);
    home.style.opacity = smooth(clamp((p - FADE_START) / (COLLAPSE_END - FADE_START))).toFixed(3);

    caps.forEach(function (c, i) {
      var w = capWidths[i];
      c.el.style.width = (w[0] + (w[1] - w[0]) * u).toFixed(2) + 'px';
      c.lo.style.opacity = (1 - u).toFixed(3);
      c.up.style.opacity = u.toFixed(3);
    });

    var knock = Math.sin(Math.PI * clamp(q / 0.3)) * 3;
    word.style.transform = knock ? 'translateX(' + knock.toFixed(2) + 'px)' : '';

    var stagger = 0.16;
    groups.forEach(function (el, i) {
      var e = smooth(clamp((q - i * stagger) / (1 - (groups.length - 1) * stagger)));
      el.style.width = (widths[i] * (1 - e)).toFixed(2) + 'px';
      el.style.opacity = clamp(1 - e * 1.35).toFixed(3);
    });
  }

  function onScroll() {
    if (!ticking) {
      ticking = true;
      window.requestAnimationFrame(update);
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', measure);
  window.addEventListener('load', measure);
  if (reduceMotion.addEventListener) { reduceMotion.addEventListener('change', update); }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(measure); }
  measure();
})();
</script>
</body>
